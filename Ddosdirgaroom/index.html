<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark"><title>Dirga · Link Room</title><link rel="stylesheet" href="room.css?v=3"><script src="room.js?v=3" defer></script></head>
<body><main class="shell"><header class="top"><div class="brand"><img class="mark" src="../assets/images/profile.jpeg" alt="Dirga"><div><strong>Dirga</strong><small>CONTENT ROOM</small></div></div><div class="topright"><button id="logout" class="secondary" hidden>Keluar</button><img id="accountAvatar" src="../assets/images/profile.jpeg" alt="Foto profil"></div></header>
<section id="login" class="login card"><div class="eyebrow">PRIVATE ACCESS</div><h1>Welcome back.</h1><p>Masuk untuk mengatur konten website.</p><form id="loginForm"><label>Username<input id="username" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username"></label><label>Password<div class="password"><input id="password" required type="password" autocomplete="current-password" placeholder="Password"><button id="reveal" type="button" class="secondary" aria-label="Tampilkan password">Lihat</button></div></label><button id="loginSubmit" class="primary wide" type="submit">Masuk</button></form></section>
<div id="status" role="status" aria-live="polite"></div>
<section id="editor" hidden><div class="hero"><div><div class="eyebrow">CONTENT CONTROL</div><h1>Kelola website.</h1><p>Edit profil, katalog dan tombol.</p></div><a class="secondary preview" href="../" target="_blank" rel="noopener noreferrer">Buka web ↗</a></div><div class="notice">Kalau ada yang ga ngerti, tanya aku yh : 081521650773</div><section class="previewpanel card"><div class="rowhead"><div><h2>Preview website</h2><small> </small></div><button class="secondary" id="previewToggle" type="button" aria-expanded="false">Tampilkan</button></div><div id="previewBody" hidden><div class="previewnav"><button class="secondary" type="button" data-preview="index.html">Home</button><button class="secondary" type="button" data-preview="bisnis.html">Commission</button></div><iframe id="webPreview" title="Preview website" loading="lazy"></iframe></div></section><div class="tabs" role="group" aria-label="Halaman"><button type="button" class="tab" data-tab="profile">Profil & About</button><button type="button" class="tab" data-tab="products">Produk</button><button type="button" class="tab active" data-tab="home">Tombol Home</button><button type="button" class="tab" data-tab="social">Social media</button><button type="button" class="tab" data-tab="commission">Tombol Commission</button></div><div class="sectionhead"><div><h2 id="sectionTitle">Home</h2><small id="count"></small></div><button id="add" class="primary">+ Tambah tombol</button></div><div id="list"></div><button id="refreshData" class="secondary" type="button">Muat ulang data</button></section></main>
<template id="rowTemplate"><article class="link card"><div class="rowhead"><div><span class="kind"></span><h3 class="rowtitle"></h3></div><button type="button" class="danger remove" hidden>Hapus</button></div><form class="editform"><label>Nama tombol<input name="label" required maxlength="80"></label><label class="hoverfield">Teks saat disentuh / hover<input name="hover_label" maxlength="80" placeholder="Opsional"></label><label>Link tujuan <small class="urlhelp">Contoh: https://djaja.com</small><input name="url" required maxlength="2048" inputmode="url" placeholder="https://..."></label><div class="bottom"><label class="orderfield">Urutan<input name="position" required type="number" min="0" max="10000" step="1"></label><button type="submit" class="primary save">Simpan</button></div></form></article></template>
<template id="profileTemplate"><article class="card link"><div class="profilepreview"><img class="bannerPreview" alt="Banner"><img class="avatarPreview" alt="Profil"></div><form><label>Nama<input name="display_name" maxlength="80" required></label><label>Username<input name="handle" maxlength="80"></label><label>Quote<input name="quote" maxlength="160"></label><label>Judul About Me<input name="about_title" maxlength="80" required></label><label>About Me<textarea name="about_text" rows="6" maxlength="5000"></textarea></label><label class="switchrow"><span><strong>Minigame dinosaurus</strong><small>Aktifkan atau sembunyikan game di website.</small></span><input name="minigame_enabled" type="checkbox" role="switch"></label><label>Ganti foto profil<input name="profileFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Ganti banner<input name="bannerFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="primary" type="submit">Simpan &amp; publikasikan</button></form></article></template><template id="productTemplate"><article class="card link"><div class="rowhead"><h3 class="rowtitle"></h3><button class="danger remove" type="button">Hapus</button></div><img class="productPreview" alt="Gambar produk" hidden><form><label>Nama produk<input name="title" maxlength="100" required></label><label>Harga<input name="price" maxlength="80" required></label><label>Link order<input name="order_url" type="url" maxlength="2048" required></label><label>Foto produk<input name="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Urutan<input name="position" type="number" min="0" max="10000" required></label><button class="primary" type="submit">Simpan produk</button></form></article></template></body></html>
